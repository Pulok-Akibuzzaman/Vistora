<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register — Vistora IELTS</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.25rem;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem 0;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <span>Vistora</span>
        <span class="brand-badge">IELTS CBT</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">← Back to Home</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 id="auth-title">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;" id="auth-subtitle">
          Sign in to access your saved test results and personalized study plan.
        </p>
      </div>

      <!-- Auth Switcher Tabs -->
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Sign In</div>
        <div class="auth-tab" id="tab-signup" onclick="switchAuthMode('signup')">Create Account</div>
      </div>

      <!-- Alert Message Box -->
      <div id="auth-alert" style="display: none;"></div>

      <!-- Authentication Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group" id="group-name" style="display: none;">
          <label class="form-label" for="auth-name">Full Name</label>
          <input type="text" id="auth-name" class="form-control" placeholder="e.g. Pulok Akibuzzaman">
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-email">Email Address</label>
          <input type="email" id="auth-email" class="form-control" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-password">Password</label>
          <input type="password" id="auth-password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-auth-submit" style="width: 100%; margin-top: 0.75rem;">
          Sign In
        </button>
      </form>

      <!-- Supabase Configuration Quick Toggle -->
      <div style="margin-top: 2rem; border-top: 1px dashed var(--border); padding-top: 1.25rem; font-size: 0.8rem; color: var(--text-dim); text-align: center;">
        <p>Backend: <strong>Supabase Auth</strong></p>
        <button type="button" onclick="promptSupabaseConfig()" style="background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; margin-top: 0.25rem;">
          Configure Supabase URL & Anon Key
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { signIn, signUp, getCurrentUser } from './js/lib/auth.js';
    import { setSupabaseConfig, isSupabaseConfigured } from './js/lib/supabaseClient.js';

    let currentMode = 'login';

    window.switchAuthMode = function(mode) {
      currentMode = mode;
      const isLogin = mode === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-signup').classList.toggle('active', !isLogin);
      document.getElementById('auth-title').innerText = isLogin ? 'Welcome Back' : 'Create Account';
      document.getElementById('auth-subtitle').innerText = isLogin 
        ? 'Sign in to access your saved test results and personalized study plan.' 
        : 'Register for free to save your exam attempts and community forum posts.';
      document.getElementById('group-name').style.display = isLogin ? 'none' : 'flex';
      document.getElementById('btn-auth-submit').innerText = isLogin ? 'Sign In' : 'Create Account';
      hideAlert();
    };

    window.promptSupabaseConfig = function() {
      const url = prompt('Enter your Supabase Project URL (e.g., https://your-id.supabase.co):');
      if (!url) return;
      const key = prompt('Enter your Supabase Anon Key:');
      if (!key) return;
      setSupabaseConfig(url, key);
    };

    function showAlert(message, type = 'danger') {
      const el = document.getElementById('auth-alert');
      el.className = `alert alert-${type}`;
      el.innerText = message;
      el.style.display = 'block';
    }

    function hideAlert() {
      const el = document.getElementById('auth-alert');
      el.style.display = 'none';
    }

    window.handleAuthSubmit = async function(event) {
      event.preventDefault();
      hideAlert();

      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value;
      const submitBtn = document.getElementById('btn-auth-submit');

      submitBtn.disabled = true;
      submitBtn.innerText = currentMode === 'login' ? 'Signing In...' : 'Registering...';

      try {
        if (currentMode === 'login') {
          await signIn(email, password);
        } else {
          await signUp(email, password, name);
          showAlert('Account created! Checking session...', 'success');
        }

        // Redirect
        const params = new URLSearchParams(window.location.search);
        const target = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : 'dashboard.html';
        window.location.href = target;
      } catch (err) {
        console.error('Auth error:', err);
        showAlert(err.message || 'Authentication failed. Please verify credentials.', 'danger');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = currentMode === 'login' ? 'Sign In' : 'Create Account';
      }
    };

    // Auto-redirect if already logged in
    async function checkExisting() {
      const user = await getCurrentUser();
      if (user) {
        const params = new URLSearchParams(window.location.search);
        const target = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : 'dashboard.html';
        window.location.href = target;
      }
    }
    checkExisting();
  </script>
</body>
</html>
