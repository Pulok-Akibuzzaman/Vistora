<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — Vistora IELTS</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand">
        <span>Vistora</span>
        <span class="brand-badge">IELTS CBT</span>
      </a>
      
      <nav>
        <ul class="nav-links">
          <li><a href="practice-test.html" class="nav-link">Practice Tests</a></li>
          <li><a href="results.html" class="nav-link">Results</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-outline btn-sm">← Back to Dashboard</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 3rem 1.5rem; max-width: 700px;">
    <div class="card">
      <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem;">
        <div style="width: 70px; height: 70px; border-radius: var(--radius-full); background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white;">
          👤
        </div>
        <div>
          <h2>Profile & Exam Preferences</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Manage your target score and academic details.</p>
        </div>
      </div>

      <div id="profile-alert" style="display: none;"></div>

      <form onsubmit="handleSaveProfile(event)">
        <div class="form-group">
          <label class="form-label" for="profile-email">Email Address</label>
          <input type="email" id="profile-email" class="form-control" disabled style="opacity: 0.6; cursor: not-allowed;">
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-name">Full Name</label>
          <input type="text" id="profile-name" class="form-control" required>
        </div>

        <div class="grid-2" style="margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label" for="profile-target-band">Target Band Score</label>
            <select id="profile-target-band" class="form-control">
              <option value="6.5">6.5 Competent</option>
              <option value="7.0">7.0 Good</option>
              <option value="7.5" selected>7.5 High</option>
              <option value="8.0">8.0 Very Good</option>
              <option value="8.5">8.5 Expert</option>
              <option value="9.0">9.0 Expert</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-exam-date">Target Exam Date</label>
            <input type="date" id="profile-exam-date" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-institution">University / Institution</label>
          <input type="text" id="profile-institution" class="form-control" placeholder="East West University">
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-bio">Bio / Study Goals</label>
          <textarea id="profile-bio" class="form-control" placeholder="e.g. Aiming for Band 7.5 to pursue Master's degree in Computer Science."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" id="btn-save-profile">Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { getCurrentUser, updateProfile } from '../js/lib/auth.js';

    async function loadProfile() {
      const user = await getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('profile-email').value = user.email || '';
      document.getElementById('profile-name').value = user.fullName || '';
      document.getElementById('profile-target-band').value = String(user.targetBand || 7.5);
      document.getElementById('profile-exam-date').value = user.targetExamDate || '';
      document.getElementById('profile-institution').value = user.institution || '';
      document.getElementById('profile-bio').value = user.bio || '';
    }

    window.handleSaveProfile = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save-profile');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      try {
        await updateProfile({
          fullName: document.getElementById('profile-name').value.trim(),
          targetBand: Number(document.getElementById('profile-target-band').value),
          targetExamDate: document.getElementById('profile-exam-date').value,
          institution: document.getElementById('profile-institution').value.trim(),
          bio: document.getElementById('profile-bio').value.trim()
        });

        const alertEl = document.getElementById('profile-alert');
        alertEl.className = 'alert alert-success';
        alertEl.innerText = 'Profile updated successfully!';
        alertEl.style.display = 'block';
        setTimeout(() => alertEl.style.display = 'none', 3000);
      } catch (err) {
        const alertEl = document.getElementById('profile-alert');
        alertEl.className = 'alert alert-danger';
        alertEl.innerText = err.message || 'Failed to update profile.';
        alertEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Changes';
      }
    };

    loadProfile();
  </script>
</body>
</html>
